<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALUNOS - CADASTRO</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>ALUNOS - CADASTRO</h1>

    <div class="container">
      <form id="add-aluno-form">
        <input type="text" name="nome" id="nome" placeholder="Nome completo" maxlength="100" required />
        <input type="text" name="cpf" id="cpf" placeholder="CPF" maxlength="11" inputmode="numeric" required />
        <input type="text" name="rg" id="rg" placeholder="RG" maxlength="9" required />
        <input type="tel" name="telefone_aluno" id="telefone_aluno" placeholder="Telefone do aluno" maxlength="11" inputmode="numeric" required />
        <input type="tel" name="telefone_responsavel" id="telefone_responsavel" placeholder="Telefone responsável" maxlength="11" inputmode="numeric" required />
        <input type="email" name="email" id="email" placeholder="E-mail" maxlength="100" required />
        <label for="data_nascimento">Data do nascimento:</label>
        <input type="date" name="data_nascimento" id="data_nascimento" required />
        <button>CADASTRAR</button>
      </form>
      <ul id="aluno-list"></ul>
    </div>
  </body>
